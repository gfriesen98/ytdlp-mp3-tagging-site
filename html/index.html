<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Yt-dlp Tag Editor</title>
  <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css" />
  <style>
    .spinner {
      border: 4px solid #535353;
      border-top: 4px solid #ffb300;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-left: 0.5rem;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .spinner-dl-color {
      border-top: 4px solid #000;
    }

    .hidden {
      display: none;
    }

    /* The Modal (background) */
    .modal {
      display: none;
      /* Hidden by default */
      position: fixed;
      /* Stay in place */
      z-index: 1;
      /* Sit on top */
      left: 0;
      top: 0;
      width: 100%;
      /* Full width */
      height: 100%;
      /* Full height */
      overflow: auto;
      /* Enable scroll if needed */
      background-color: "#535353";
      /* Fallback color */
      /* background-color: rgba(0, 0, 0, 0.4); */
      /* Black w/ opacity */
    }

    /* Modal Content/Box */
    .modal-content {
      /* background-color: #fefefe; */
      background-color: #2b2b2b;
      margin: 15% auto;
      /* 15% from the top and centered */
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      /* Could be more or less, depending on screen size */
    }

    /* The Close Button */
    .close {
      /* color: #aaa; */
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      /* color: black; */
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <span style="margin-top: 2%;">
    <a href="/about.html">about</a>
    <a href="/help.html">help</a>
    <span style="float: right" id="cVer"></span>
    <span style="float: right" id="sId"></span>
  </span>

  <h1>Yt-dlp + Tag Editor</h1>
  <label>Youtube URL</label>
  <input type="text" name="url-input" id="url-input" />
  <span id="message"></span>

  <button onclick="addQueueItem()" style="margin-top: 1%">Add to queue</button>

  <button id="modalButton">Clip editor</button>
  <button onclick="startDownload()" id="dl-button" style="margin-top: 2%" disabled>Download</button>

  <!-- Clip editor Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" id="close">&times;</span>
      <h3>Clip editor</h3>
      <p>Split or clip a youtube video by timestamps, useful for when people upload full albums</p>
      <p>Metadata (MP3)</p>
      <input id="modalArtist" placeholder="artist"/>
      <input id="modalAlbum" placeholder="album"/>
      <input id="modalYear" placeholder="year"/>
      <b>Audio only?</b> <input type="checkbox" checked id="modal-audioonly-checkbox"/>
      <p>Add timestamps</p>
      <table id="timestamps">
        <thead>
          <tr>
            <th>Title</th>
            <th>Start</th>
            <th>End</th>
          </tr>
        </thead>
        <tbody id="timestampBody">
          <!-- populated -->
        </tbody>
      </table>
      <button id="timestampAdd">Add timestamp</button>
      <br/>
      <br/>
      <button id="modalDownload">Download & Clip</button>
    </div>
  </div>
  <!--  -->

  <label for="dl-progress" id="dl-progress-label" style="margin: 2rem 0 0 0">Download not started</label>
  <progress id="dl-progress">progress</progress>

  <section style="margin: 1rem 0">
    <b>Queue</b>

    <ul id="queue-list"></ul>
  </section>
  <script src="./js/util.js"></script>
  <script>
    window.onload = async () => {
      document.getElementById("sId").innerHTML = `sessionId (for debugging): <code>${sessionId}</code>`;
      let currVersion = "";
      let githubVersion = "";
      const currVersionRes = await fetch("/api/ytdlp/version");
      const currVersionJson = await currVersionRes.json();
      if (currVersionJson.success) {
        currVersion = currVersionJson.message;
      }

      const ghVersionRes = await fetch("https://api.github.com/repos/yt-dlp/yt-dlp/releases");
      const ghVersionJson = await ghVersionRes.json();
      if (ghVersionRes.status === 200) {
        githubVersion = ghVersionJson[0].tag_name;
      }

      console.log(`yt-dlp version in use: ${currVersion}\nyt-dlp github latest version: ${githubVersion}`);
      let span = document.getElementById("cVer");
      if (currVersion != githubVersion) {
        span.innerHTML = `Current yt-dlp version: <code>${currVersion}</code>. Update available!`;
      } else {
        span.innerHTML = `Current yt-dlp version: <code>${currVersion}</code>`;
      }
    }
  </script>
</body>

</html>
